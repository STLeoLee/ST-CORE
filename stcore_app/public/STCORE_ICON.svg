<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-strong" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComponentTransfer in="blur" result="glow1">
        <feFuncA type="linear" slope="2"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="glow1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <radialGradient id="greenGrad" cx="0" cy="0" r="180" gradientUnits="userSpaceOnUse">
      <stop offset="30%" stop-color="#146d37" />
      <stop offset="85%" stop-color="#24ad56" />
      <stop offset="100%" stop-color="#198a44" />
    </radialGradient>

    <g id="quadrant">
      <path d="M 12 -65 
               L 12 -180 
               A 180 180 0 0 1 180 -12 
               L 65 -12 
               A 65 65 0 0 0 12 -65 Z" 
            fill="url(#greenGrad)" />
      
      <path d="M 100 -12 A 100 100 0 0 0 12 -100 L 12 -120 A 120 120 0 0 1 120 -12 Z" fill="#1b9549" opacity="0.6"/>

      <polyline points="22,-80 22,-150 45,-173" stroke="#60f0a5" stroke-width="1.5" fill="none"/>
      <circle cx="45" cy="-173" r="3.5" fill="#60f0a5" filter="url(#glow)"/>

      <polyline points="45,-25 110,-25 140,-55 140,-110" stroke="#60f0a5" stroke-width="1.5" fill="none"/>
      <circle cx="140" cy="-110" r="3.5" fill="#60f0a5" filter="url(#glow)"/>

      <polyline points="15,-40 80,-40 105,-65 105,-100" stroke="#60f0a5" stroke-width="1.5" fill="none"/>
      <circle cx="105" cy="-100" r="3.5" fill="#60f0a5" filter="url(#glow)"/>
      
      <polyline points="28,-60 65,-60 85,-80" stroke="#60f0a5" stroke-width="1" fill="none"/>
      <circle cx="85" cy="-80" r="2.5" fill="#60f0a5"/>

      <circle cx="162" cy="-162" r="3" fill="#00ffff" filter="url(#glow)" opacity="0.8"/>
    </g>
  </defs>

  <circle cx="250" cy="250" r="230" stroke="#b6c2cb" stroke-width="3" fill="none" opacity="0.6"/>
  <circle cx="250" cy="250" r="215" stroke="#e0e6eb" stroke-width="1.5" fill="none" opacity="0.5"/>
  <circle cx="250" cy="250" r="195" stroke="#909ca6" stroke-width="6" fill="none"/>

  <line x1="10" y1="250" x2="490" y2="250" stroke="#909ca6" stroke-width="4"/>
  <line x1="250" y1="10" x2="250" y2="490" stroke="#909ca6" stroke-width="4"/>

  <g transform="translate(250, 250)">
    <use href="#quadrant" />
    <use href="#quadrant" transform="rotate(90)" />
    <use href="#quadrant" transform="rotate(180)" />
    <use href="#quadrant" transform="rotate(270)" />
  </g>

  <circle cx="250" cy="250" r="85" fill="#061f14" opacity="0.9"/>
  <circle cx="250" cy="250" r="85" stroke="#00ffff" stroke-width="1" fill="none" opacity="0.4"/>
  <circle cx="250" cy="250" r="60" stroke="#00ffff" stroke-width="2" stroke-dasharray="8 6" fill="none" opacity="0.7"/>

  <g transform="translate(250, 250)">
    <path d="M -160 0 L -15 -10 L 0 -160 L 15 -10 L 160 0 L 15 10 L 0 160 L -15 10 Z" fill="#00e5ff" filter="url(#glow-strong)" opacity="0.6"/>
    <path d="M -80 0 L -8 -5 L 0 -80 L 8 -5 L 80 0 L 8 5 L 0 80 L -8 5 Z" fill="#ffffff" filter="url(#glow-strong)" opacity="0.8"/>

    <g stroke="#00ffff" stroke-width="3" filter="url(#glow)">
      <line x1="0" y1="0" x2="-35" y2="-45" />
      <line x1="0" y1="0" x2="45" y2="-25" />
      <line x1="0" y1="0" x2="-25" y2="55" />
      <line x1="0" y1="0" x2="40" y2="40" />
      <line x1="-35" y1="-45" x2="15" y2="-65" stroke-width="2"/>
      <line x1="45" y1="-25" x2="15" y2="-65" stroke-width="2"/>
      <line x1="-35" y1="-45" x2="-65" y2="15" stroke-width="2"/>
      <line x1="-25" y1="55" x2="-65" y2="15" stroke-width="2"/>
      <line x1="40" y1="40" x2="65" y2="15" stroke-width="2"/>
      <line x1="45" y1="-25" x2="65" y2="15" stroke-width="2"/>
      <line x1="-25" y1="55" x2="25" y2="70" stroke-width="2"/>
      <line x1="40" y1="40" x2="25" y2="70" stroke-width="2"/>
    </g>

    <g filter="url(#glow-strong)">
      <circle cx="-35" cy="-45" r="7.5" fill="#00ffff"/>
      <circle cx="45" cy="-25" r="8" fill="#00ffff"/>
      <circle cx="-25" cy="55" r="7" fill="#00ffff"/>
      <circle cx="40" cy="40" r="7" fill="#00ffff"/>
      <circle cx="15" cy="-65" r="6" fill="#00ffff"/>
      <circle cx="-65" cy="15" r="5" fill="#00ffff"/>
      <circle cx="65" cy="15" r="6" fill="#00ffff"/>
      <circle cx="25" cy="70" r="5.5" fill="#00ffff"/>
    </g>
    
    <circle cx="0" cy="0" r="25" fill="#00ffff" opacity="0.3" filter="url(#glow-strong)"/>
    <circle cx="0" cy="0" r="10" fill="#ccffff" filter="url(#glow-strong)"/>
    <circle cx="0" cy="0" r="5" fill="#ffffff" />
  </g>
</svg>
